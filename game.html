<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#080b18"
    >

    <meta
        name="description"
        content="Ultimate World Game Arena"
    >

    <title>Ultimate World — Game Arena</title>

    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            color: white;

            background:
                radial-gradient(
                    circle at 15% 10%,
                    rgba(90, 70, 255, .22),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 85% 20%,
                    rgba(0, 220, 255, .15),
                    transparent 25%
                ),
                radial-gradient(
                    circle at 50% 100%,
                    rgba(255, 40, 180, .12),
                    transparent 30%
                ),
                #060814;
        }


        /* =====================================================
           BACKGROUND
        ===================================================== */

        .background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(70px);
            opacity: .28;
            animation: floatOrb 12s ease-in-out infinite;
        }

        .orb.one {
            width: 300px;
            height: 300px;
            background: #6448ff;
            left: -100px;
            top: 10%;
        }

        .orb.two {
            width: 250px;
            height: 250px;
            background: #00d9ff;
            right: -80px;
            top: 35%;
            animation-delay: -4s;
        }

        .orb.three {
            width: 220px;
            height: 220px;
            background: #ff35b8;
            left: 40%;
            bottom: -100px;
            animation-delay: -8s;
        }

        @keyframes floatOrb {

            0%,
            100% {
                transform: translate3d(0, 0, 0);
            }

            50% {
                transform: translate3d(30px, -35px, 0);
            }

        }


        /* =====================================================
           APP
        ===================================================== */

        .app {
            position: relative;
            z-index: 2;

            width: 100%;
            height: 100%;

            display: flex;
            flex-direction: column;
        }


        /* =====================================================
           TOP BAR
        ===================================================== */

        .topbar {

            height: 74px;

            display: flex;
            align-items: center;
            gap: 18px;

            padding:
                10px 18px;

            background:
                rgba(8, 11, 24, .78);

            border-bottom:
                1px solid
                rgba(255,255,255,.08);

            backdrop-filter:
                blur(20px);

            -webkit-backdrop-filter:
                blur(20px);

            box-shadow:
                0 12px 40px
                rgba(0,0,0,.25);

        }


        .back-button {

            width: 46px;
            height: 46px;

            border-radius: 14px;

            border:
                1px solid
                rgba(255,255,255,.1);

            background:
                rgba(255,255,255,.06);

            color: white;

            font-size: 22px;

            cursor: pointer;

            transition:
                .2s ease;

        }

        .back-button:hover {

            transform:
                translateY(-2px);

            background:
                rgba(255,255,255,.12);

        }


        .game-title-area {

            min-width: 0;
            flex: 1;

        }

        .game-title {

            font-size: 20px;
            font-weight: 900;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;

        }

        .game-category {

            margin-top: 3px;

            color:
                rgba(255,255,255,.55);

            font-size: 12px;

            font-weight: 700;

            text-transform:
                uppercase;

            letter-spacing:
                1.2px;

        }


        /* =====================================================
           STATS
        ===================================================== */

        .stats {

            display: flex;
            align-items: center;
            gap: 9px;
        }

        .stat {

            min-width: 75px;

            padding:
                8px 12px;

            border-radius: 13px;

            background:
                rgba(255,255,255,.055);

            border:
                1px solid
                rgba(255,255,255,.08);

            text-align: center;

        }

        .stat-label {

            display: block;

            font-size: 9px;

            color:
                rgba(255,255,255,.45);

            font-weight: 800;

            letter-spacing:
                1px;

            text-transform:
                uppercase;

        }

        .stat-value {

            display: block;

            margin-top: 2px;

            font-size: 16px;

            font-weight: 950;

        }


        /* =====================================================
           MAIN
        ===================================================== */

        .main {

            flex: 1;

            min-height: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

        }


        .game-shell {

            width: min(
                1200px,
                100%
            );

            height: 100%;

            max-height: 850px;

            display: flex;

            flex-direction: column;

            gap: 14px;

        }


        /* =====================================================
           GAME HUD
        ===================================================== */

        .hud {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 12px;

        }


        .hud-left,
        .hud-right {

            display: flex;

            align-items: center;

            gap: 10px;

        }


        .pill {

            display: flex;

            align-items: center;

            gap: 7px;

            padding:
                8px 13px;

            border-radius: 999px;

            background:
                rgba(255,255,255,.055);

            border:
                1px solid
                rgba(255,255,255,.08);

            font-size: 13px;

            font-weight: 800;

        }


        .pill-icon {

            font-size: 15px;

        }


        /* =====================================================
           CANVAS FRAME
        ===================================================== */

        .game-frame {

            position: relative;

            flex: 1;

            min-height: 300px;

            border-radius: 26px;

            overflow: hidden;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.075),
                    rgba(255,255,255,.025)
                );

            border:
                1px solid
                rgba(255,255,255,.12);

            box-shadow:
                0 30px 90px
                rgba(0,0,0,.42),
                inset 0 1px 0
                rgba(255,255,255,.08);

        }


        canvas {

            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            display: block;

        }


        /* =====================================================
           GAME OVERLAY
        ===================================================== */

        .overlay {

            position: absolute;

            inset: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 25px;

            background:
                rgba(3,5,14,.72);

            backdrop-filter:
                blur(16px);

            -webkit-backdrop-filter:
                blur(16px);

            opacity: 0;

            pointer-events: none;

            transition:
                .25s ease;

        }


        .overlay.visible {

            opacity: 1;

            pointer-events: auto;

        }


        .panel {

            width:
                min(
                    470px,
                    100%
                );

            padding: 32px;

            border-radius: 28px;

            background:
                linear-gradient(
                    145deg,
                    rgba(31,35,62,.96),
                    rgba(11,14,29,.96)
                );

            border:
                1px solid
                rgba(255,255,255,.12);

            box-shadow:
                0 35px 100px
                rgba(0,0,0,.5);

            text-align: center;

        }


        .result-icon {

            font-size: 55px;

            margin-bottom: 8px;

        }


        .result-title {

            font-size: 32px;

            font-weight: 950;

        }


        .result-subtitle {

            margin-top: 8px;

            color:
                rgba(255,255,255,.55);

            font-size: 14px;

        }


        .result-grid {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 10px;

            margin:
                25px 0;

        }


        .result-card {

            padding: 15px;

            border-radius: 17px;

            background:
                rgba(255,255,255,.055);

            border:
                1px solid
                rgba(255,255,255,.07);

        }


        .result-card small {

            display: block;

            color:
                rgba(255,255,255,.45);

            font-size: 10px;

            font-weight: 800;

            text-transform:
                uppercase;

            letter-spacing:
                1px;

        }


        .result-card strong {

            display: block;

            margin-top: 4px;

            font-size: 22px;

        }


        /* =====================================================
           BUTTONS
        ===================================================== */

        .button-row {

            display: flex;

            gap: 10px;

        }


        .button {

            flex: 1;

            min-height: 50px;

            border: none;

            border-radius: 15px;

            color: white;

            font-size: 14px;

            font-weight: 900;

            cursor: pointer;

            transition:
                .2s ease;

        }


        .button:hover {

            transform:
                translateY(-2px);

        }


        .button.primary {

            background:
                linear-gradient(
                    135deg,
                    #7657ff,
                    #b13cff
                );

            box-shadow:
                0 12px 30px
                rgba(118,87,255,.25);

        }


        .button.secondary {

            background:
                rgba(255,255,255,.07);

            border:
                1px solid
                rgba(255,255,255,.1);

        }


        /* =====================================================
           BOTTOM CONTROLS
        ===================================================== */

        .controls {

            display: flex;

            justify-content: center;

            gap: 10px;

        }


        .control-button {

            width: 54px;
            height: 44px;

            border-radius: 13px;

            background:
                rgba(255,255,255,.055);

            border:
                1px solid
                rgba(255,255,255,.08);

            color: white;

            font-size: 18px;

            cursor: pointer;

        }


        .control-button:active {

            transform:
                scale(.94);

            background:
                rgba(255,255,255,.13);

        }


        /* =====================================================
           PAUSE
        ===================================================== */

        .pause-screen {

            position: absolute;

            inset: 0;

            z-index: 10;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                rgba(3,5,14,.7);

            backdrop-filter:
                blur(15px);

            opacity: 0;

            pointer-events: none;

            transition:
                .2s ease;

        }


        .pause-screen.visible {

            opacity: 1;

            pointer-events: auto;

        }


        .pause-card {

            text-align: center;

            padding: 35px;

        }


        .pause-card h2 {

            font-size: 36px;

            font-weight: 950;

        }


        .pause-card p {

            margin-top: 7px;

            color:
                rgba(255,255,255,.5);

        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media(max-width: 800px){

            .topbar {

                height: 64px;

                padding:
                    8px 10px;

                gap: 9px;

            }

            .game-title {

                font-size: 16px;

            }

            .game-category {

                font-size: 9px;

            }

            .stat {

                min-width: 58px;

                padding:
                    6px 8px;

            }

            .stat-label {

                font-size: 8px;

            }

            .stat-value {

                font-size: 13px;

            }

            .main {

                padding:
                    10px;

            }

            .game-frame {

                border-radius:
                    19px;

            }

            .hud {

                flex-wrap: wrap;

            }

        }


        @media(max-width: 520px){

            .stats .stat:nth-child(3),
            .stats .stat:nth-child(4){

                display: none;

            }

            .game-shell {

                gap: 8px;

            }

            .panel {

                padding: 24px;

            }

            .result-title {

                font-size: 27px;

            }

        }

    </style>
</head>


<body>

    <!-- =====================================================
         BACKGROUND
    ====================================================== -->

    <div class="background">

        <div class="orb one"></div>
        <div class="orb two"></div>
        <div class="orb three"></div>

    </div>


    <!-- =====================================================
         APP
    ====================================================== -->

    <div class="app">


        <!-- =================================================
             TOP BAR
        ================================================== -->

        <header class="topbar">

            <button
                class="back-button"
                id="backButton"
                aria-label="Back"
            >
                ←
            </button>


            <div class="game-title-area">

                <div
                    class="game-title"
                    id="gameTitle"
                >
                    Ultimate World Game
                </div>

                <div
                    class="game-category"
                    id="gameCategory"
                >
                    GAME ARENA
                </div>

            </div>


            <div class="stats">

                <div class="stat">

                    <span class="stat-label">
                        Score
                    </span>

                    <span
                        class="stat-value"
                        id="score"
                    >
                        0
                    </span>

                </div>


                <div class="stat">

                    <span class="stat-label">
                        XP
                    </span>

                    <span
                        class="stat-value"
                        id="xp"
                    >
                        0
                    </span>

                </div>


                <div class="stat">

                    <span class="stat-label">
                        Coins
                    </span>

                    <span
                        class="stat-value"
                        id="coins"
                    >
                        0
                    </span>

                </div>


                <div class="stat">

                    <span class="stat-label">
                        Level
                    </span>

                    <span
                        class="stat-value"
                        id="level"
                    >
                        1
                    </span>

                </div>

            </div>

        </header>


        <!-- =================================================
             MAIN
        ================================================== -->

        <main class="main">

            <section class="game-shell">


                <!-- =========================================
                     HUD
                ========================================== -->

                <div class="hud">

                    <div class="hud-left">

                        <div class="pill">

                            <span class="pill-icon">
                                ❤️
                            </span>

                            <span id="lives">
                                3
                            </span>

                        </div>


                        <div class="pill">

                            <span class="pill-icon">
                                🔥
                            </span>

                            <span id="combo">
                                x1
                            </span>

                        </div>


                        <div class="pill">

                            <span class="pill-icon">
                                ⏱️
                            </span>

                            <span id="timer">
                                00:00
                            </span>

                        </div>

                    </div>


                    <div class="hud-right">

                        <button
                            class="control-button"
                            id="pauseButton"
                            aria-label="Pause"
                        >
                            ⏸
                        </button>

                    </div>

                </div>


                <!-- =========================================
                     GAME
                ========================================== -->

                <div
                    class="game-frame"
                    id="gameFrame"
                >

                    <canvas
                        id="gameCanvas"
                    ></canvas>


                    <!-- =====================================
                         PAUSE
                    ====================================== -->

                    <div
                        class="pause-screen"
                        id="pauseScreen"
                    >

                        <div class="pause-card">

                            <div
                                style="font-size:55px"
                            >
                                ⏸️
                            </div>

                            <h2>
                                PAUSED
                            </h2>

                            <p>
                                Your game is waiting.
                            </p>

                            <br>

                            <button
                                class="button primary"
                                id="resumeButton"
                            >
                                RESUME
                            </button>

                        </div>

                    </div>


                    <!-- =====================================
                         RESULTS
                    ====================================== -->

                    <div
                        class="overlay"
                        id="resultOverlay"
                    >

                        <div class="panel">

                            <div
                                class="result-icon"
                                id="resultIcon"
                            >
                                🏆
                            </div>

                            <div
                                class="result-title"
                                id="resultTitle"
                            >
                                GAME COMPLETE
                            </div>

                            <div
                                class="result-subtitle"
                                id="resultSubtitle"
                            >
                                Great performance.
                            </div>


                            <div class="result-grid">

                                <div class="result-card">

                                    <small>
                                        Score
                                    </small>

                                    <strong
                                        id="resultScore"
                                    >
                                        0
                                    </strong>

                                </div>


                                <div class="result-card">

                                    <small>
                                        XP Earned
                                    </small>

                                    <strong
                                        id="resultXP"
                                    >
                                        +0
                                    </strong>

                                </div>


                                <div class="result-card">

                                    <small>
                                        Level
                                    </small>

                                    <strong
                                        id="resultLevel"
                                    >
                                        1
                                    </strong>

                                </div>


                                <div class="result-card">

                                    <small>
                                        Time
                                    </small>

                                    <strong
                                        id="resultTime"
                                    >
                                        00:00
                                    </strong>

                                </div>

                            </div>


                            <div class="button-row">

                                <button
                                    class="button secondary"
                                    id="homeButton"
                                >
                                    HOME
                                </button>

                                <button
                                    class="button primary"
                                    id="restartButton"
                                >
                                    PLAY AGAIN
                                </button>

                            </div>

                        </div>

                    </div>

                </div>


                <!-- =========================================
                     MOBILE / GAME CONTROLS
                ========================================== -->

                <div
                    class="controls"
                    id="controls"
                >

                    <button
                        class="control-button"
                        data-control="left"
                    >
                        ◀
                    </button>

                    <button
                        class="control-button"
                        data-control="up"
                    >
                        ▲
                    </button>

                    <button
                        class="control-button"
                        data-control="down"
                    >
                        ▼
                    </button>

                    <button
                        class="control-button"
                        data-control="right"
                    >
                        ▶
                    </button>

                    <button
                        class="control-button"
                        data-control="action"
                    >
                        ●
                    </button>

                </div>

            </section>

        </main>

    </div>


    <!-- =====================================================
         TOAST
    ====================================================== -->

    <div
        id="toast"
        style="
            position:fixed;
            left:50%;
            bottom:30px;
            transform:translateX(-50%) translateY(20px);
            padding:12px 18px;
            border-radius:999px;
            background:rgba(20,23,40,.94);
            border:1px solid rgba(255,255,255,.12);
            box-shadow:0 15px 40px rgba(0,0,0,.35);
            color:white;
            font-size:13px;
            font-weight:800;
            opacity:0;
            pointer-events:none;
            transition:.25s ease;
            z-index:100;
        "
    ></div>


    <!-- =====================================================
         GAME ENGINE
    ====================================================== -->

    <script src="game-engine.js"></script>


    <!-- =====================================================
         GAME PAGE CONTROLLER
    ====================================================== -->

    <script>

        "use strict";


        /* =================================================
           ELEMENTS
        ================================================== */

        const canvas =
            document.getElementById(
                "gameCanvas"
            );

        const ctx =
            canvas.getContext(
                "2d"
            );

        const frame =
            document.getElementById(
                "gameFrame"
            );

        const scoreElement =
            document.getElementById(
                "score"
            );

        const xpElement =
            document.getElementById(
                "xp"
            );

        const coinsElement =
            document.getElementById(
                "coins"
            );

        const levelElement =
            document.getElementById(
                "level"
            );

        const livesElement =
            document.getElementById(
                "lives"
            );

        const comboElement =
            document.getElementById(
                "combo"
            );

        const timerElement =
            document.getElementById(
                "timer"
            );


        /* =================================================
           RESIZE
        ================================================== */

        let width = 0;
        let height = 0;


        function resizeCanvas(){

            const rect =
                frame.getBoundingClientRect();

            const ratio =
                Math.min(
                    window.devicePixelRatio || 1,
                    2
                );

            width =
                rect.width;

            height =
                rect.height;

            canvas.width =
                width * ratio;

            canvas.height =
                height * ratio;

            canvas.style.width =
                width + "px";

            canvas.style.height =
                height + "px";

            ctx.setTransform(
                ratio,
                0,
                0,
                ratio,
                0,
                0
            );

        }


        window.addEventListener(
            "resize",
            resizeCanvas
        );


        resizeCanvas();


        /* =================================================
           GAME DATA
        ================================================== */

        const params =
            new URLSearchParams(
                window.location.search
            );

        const requestedGame =
            params.get("game");


        let gameId =
            requestedGame ||
            "neon-rush";


        let gameInstance = null;


        /* =================================================
           CREATE GAME
        ================================================== */

        function setupGame(){

            const registered =
                UltimateWorld.getRegisteredGame(
                    gameId
                );

            /*
             * If a future game is registered,
             * this page automatically becomes
             * its game screen.
             */

            if(registered){

                gameInstance =
                    UltimateWorld.launchGame(
                        gameId
                    );

            }else{

                /*
                 * Current fallback.
                 */

                gameInstance =
                    UltimateWorld.launchGame(
                        "neon-rush"
                    );

                gameId =
                    "neon-rush";

            }


            const config =
                registered
                    ? registered.config
                    : {
                        name:"Neon Rush",
                        category:"Racing"
                    };


            document.getElementById(
                "gameTitle"
            ).textContent =
                config.name ||
                "Ultimate World Game";


            document.getElementById(
                "gameCategory"
            ).textContent =
                config.category ||
                "GAME ARENA";


            if(
                gameInstance &&
                typeof gameInstance.start ===
                "function"
            ){

                gameInstance.start();

            }

        }


        /* =================================================
           UPDATE HUD
        ================================================== */

        function updateHUD(){

            if(
                !gameInstance ||
                !gameInstance.session
            ){

                return;

            }

            const session =
                gameInstance.session;

            const profile =
                UltimateWorld.getProfile();


            scoreElement.textContent =
                Math.floor(
                    session.score
                ).toLocaleString();


            xpElement.textContent =
                profile.xp.toLocaleString();


            coinsElement.textContent =
                profile.coins.toLocaleString();


            levelElement.textContent =
                profile.level;


            livesElement.textContent =
                session.lives;


            comboElement.textContent =
                "x" +
                Math.max(
                    1,
                    session.getComboMultiplier()
                ).toFixed(
                    session.getComboMultiplier() % 1
                        ? 2
                        : 0
                );


            timerElement.textContent =
                formatTime(
                    session.time
                );

        }


        /* =================================================
           TIME
        ================================================== */

        function formatTime(seconds){

            seconds =
                Math.max(
                    0,
                    Math.floor(
                        seconds
                    )
                );

            const minutes =
                Math.floor(
                    seconds / 60
                );

            const secs =
                seconds % 60;

            return (
                String(minutes)
                    .padStart(2,"0")
                +
                ":" +
                String(secs)
                    .padStart(2,"0")
            );

        }


        /* =================================================
           BACKGROUND
        ================================================== */

        function drawBackground(){

            const gradient =
                ctx.createLinearGradient(
                    0,
                    0,
                    width,
                    height
                );

            gradient.addColorStop(
                0,
                "#090d20"
            );

            gradient.addColorStop(
                .5,
                "#11152c"
            );

            gradient.addColorStop(
                1,
                "#080a16"
            );

            ctx.fillStyle =
                gradient;

            ctx.fillRect(
                0,
                0,
                width,
                height
            );


            /*
             * Grid
             */

            ctx.globalAlpha =
                .07;

            ctx.strokeStyle =
                "#ffffff";

            ctx.lineWidth =
                1;

            const grid =
                45;

            for(
                let x = 0;
                x < width;
                x += grid
            ){

                ctx.beginPath();

                ctx.moveTo(
                    x,
                    0
                );

                ctx.lineTo(
                    x,
                    height
                );

                ctx.stroke();

            }


            for(
                let y = 0;
                y < height;
                y += grid
            ){

                ctx.beginPath();

                ctx.moveTo(
                    0,
                    y
                );

                ctx.lineTo(
                    width,
                    y
                );

                ctx.stroke();

            }

            ctx.globalAlpha =
                1;

        }


        /* =================================================
           DEMO GAME RENDER
        ================================================== */

        function renderDemo(){

            if(
                !gameInstance ||
                !gameInstance.player
            ){

                return;

            }


            const player =
                gameInstance.player;


            /*
             * Track
             */

            const trackWidth =
                Math.min(
                    width * .75,
                    620
                );

            const trackX =
                (width - trackWidth) / 2;


            const trackGradient =
                ctx.createLinearGradient(
                    trackX,
                    0,
                    trackX + trackWidth,
                    0
                );

            trackGradient.addColorStop(
                0,
                "#11162d"
            );

            trackGradient.addColorStop(
                .5,
                "#202647"
            );

            trackGradient.addColorStop(
                1,
                "#11162d"
            );


            ctx.fillStyle =
                trackGradient;

            ctx.fillRect(
                trackX,
                0,
                trackWidth,
                height
            );


            /*
             * Lane markers
             */

            ctx.globalAlpha =
                .25;

            ctx.strokeStyle =
                "#ffffff";

            ctx.setLineDash(
                [18,18]
            );

            ctx.lineWidth =
                3;

            for(
                let i = 1;
                i < 3;
                i++
            ){

                const x =
                    trackX +
                    trackWidth *
                    (i / 3);

                ctx.beginPath();

                ctx.moveTo(
                    x,
                    0
                );

                ctx.lineTo(
                    x,
                    height
                );

                ctx.stroke();

            }

            ctx.setLineDash([]);

            ctx.globalAlpha =
                1;


            /*
             * Obstacles
             */

            if(
                gameInstance.obstacles
            ){

                gameInstance.obstacles
                    .forEach(
                        obstacle => {

                            const x =
                                trackX +
                                obstacle.x *
                                trackWidth;

                            const y =
                                obstacle.y *
                                height;

                            const w =
                                obstacle.width *
                                trackWidth;

                            const h =
                                obstacle.height *
                                height;


                            ctx.fillStyle =
                                "#ff3e75";

                            ctx.shadowBlur =
                                22;

                            ctx.shadowColor =
                                "#ff3e75";

                            ctx.fillRect(
                                x - w / 2,
                                y,
                                w,
                                h
                            );

                            ctx.shadowBlur =
                                0;

                        }
                    );

            }


            /*
             * Player
             */

            const px =
                trackX +
                player.x *
                trackWidth;

            const py =
                player.y *
                height;


            ctx.beginPath();

            ctx.arc(
                px,
                py,
                18,
                0,
                Math.PI * 2
            );

            ctx.fillStyle =
                "#7c5cff";

            ctx.shadowBlur =
                30;

            ctx.shadowColor =
                "#7c5cff";

            ctx.fill();

            ctx.shadowBlur =
                0;


            ctx.beginPath();

            ctx.arc(
                px,
                py,
                7,
                0,
                Math.PI * 2
            );

            ctx.fillStyle =
                "#ffffff";

            ctx.fill();

        }


        /* =================================================
           GAME LOOP
        ================================================== */

        let lastFrame =
            performance.now();


        function gameLoop(now){

            const delta =
                Math.min(
                    .1,
                    (now - lastFrame) /
                    1000
                );

            lastFrame =
                now;


            drawBackground();


            if(
                gameInstance &&
                typeof gameInstance.update ===
                "function"
            ){

                gameInstance.update(
                    delta
                );

            }


            renderDemo();


            updateHUD();


            UltimateWorld.updateScreenShake(
                delta
            );

            UltimateWorld.applyScreenShake(
                frame
            );


            requestAnimationFrame(
                gameLoop
            );

        }


        /* =================================================
           PAUSE
        ================================================== */

        const pauseScreen =
            document.getElementById(
                "pauseScreen"
            );

        const pauseButton =
            document.getElementById(
                "pauseButton"
            );

        const resumeButton =
            document.getElementById(
                "resumeButton"
            );


        function pauseGame(){

            if(
                !gameInstance ||
                !gameInstance.session
            ){

                return;

            }

            gameInstance.session.pause();

            pauseScreen.classList.add(
                "visible"
            );

        }


        function resumeGame(){

            if(
                !gameInstance ||
                !gameInstance.session
            ){

                return;

            }

            gameInstance.session.resume();

            pauseScreen.classList.remove(
                "visible"
            );

        }


        pauseButton.addEventListener(
            "click",
            pauseGame
        );


        resumeButton.addEventListener(
            "click",
            resumeGame
        );


        /* =================================================
           RESULTS
        ================================================== */

        const resultOverlay =
            document.getElementById(
                "resultOverlay"
            );


        function showResults(){

            if(
                !gameInstance ||
                !gameInstance.session
            ){

                return;

            }

            const session =
                gameInstance.session;


            document.getElementById(
                "resultIcon"
            ).textContent =
                session.won
                    ? "🏆"
                    : "💥";


            document.getElementById(
                "resultTitle"
            ).textContent =
                session.won
                    ? "VICTORY!"
                    : "GAME OVER";


            document.getElementById(
                "resultSubtitle"
            ).textContent =
                session.won
                    ? "That was an excellent run."
                    : "Ready for another attempt?";


            document.getElementById(
                "resultScore"
            ).textContent =
                session.score
                    .toLocaleString();


            document.getElementById(
                "resultXP"
            ).textContent =
                "+" +
                Math.max(
                    0,
                    Math.floor(
                        session.score / 10
                    )
                );


            document.getElementById(
                "resultLevel"
            ).textContent =
                UltimateWorld
                    .getProfile()
                    .level;


            document.getElementById(
                "resultTime"
            ).textContent =
                formatTime(
                    session.time
                );


            resultOverlay.classList.add(
                "visible"
            );

        }


        /* =================================================
           SESSION END EVENT
        ================================================== */

        if(
            gameInstance &&
            gameInstance.session
        ){

            gameInstance.session.on(
                "end",
                showResults
            );

        }


        /* =================================================
           BUTTON NAVIGATION
        ================================================== */

        document.getElementById(
            "backButton"
        ).addEventListener(
            "click",
            () => {

                window.location.href =
                    "gameverse.html";

            }
        );


        document.getElementById(
            "homeButton"
        ).addEventListener(
            "click",
            () => {

                window.location.href =
                    "home.html";

            }
        );


        document.getElementById(
            "restartButton"
        ).addEventListener(
            "click",
            () => {

                window.location.reload();

            }
        );


        /* =================================================
           TOUCH / CONTROL BUTTONS
        ================================================== */

        document.querySelectorAll(
            "[data-control]"
        ).forEach(
            button => {

                const control =
                    button.dataset.control;


                function press(){

                    if(
                        !gameInstance ||
                        !gameInstance.player
                    ){

                        return;

                    }


                    const player =
                        gameInstance.player;


                    const amount =
                        .08;


                    if(
                        control === "left"
                    ){

                        player.x -= amount;

                    }


                    if(
                        control === "right"
                    ){

                        player.x += amount;

                    }


                    if(
                        control === "up"
                    ){

                        player.y -= amount;

                    }


                    if(
                        control === "down"
                    ){

                        player.y += amount;

                    }


                    if(
                        control === "action"
                    ){

                        gameInstance.session
                            .addScore(
                                10,
                                "action"
                            );

                        gameInstance.session
                            .addCombo();

                        UltimateWorld.sound
                            .click();

                        UltimateWorld.particles
                            .burst(
                                width / 2,
                                height / 2,
                                10,
                                {
                                    color:
                                        UltimateWorld.randomNeon()
                                }
                            );

                    }


                    player.x =
                        UltimateWorld.clamp(
                            player.x,
                            .08,
                            .92
                        );


                    player.y =
                        UltimateWorld.clamp(
                            player.y,
                            .08,
                            .92
                        );

                }


                button.addEventListener(
                    "pointerdown",
                    event => {

                        event.preventDefault();

                        press();

                    }
                );

            }
        );


        /* =================================================
           KEYBOARD
        ================================================== */

        window.addEventListener(
            "keydown",
            event => {

                if(
                    event.key ===
                    "Escape"
                ){

                    if(
                        gameInstance &&
                        gameInstance.session
                    ){

                        if(
                            gameInstance.session
                                .paused
                        ){

                            resumeGame();

                        }else{

                            pauseGame();

                        }

                    }

                }

            }
        );


        /* =================================================
           START
        ================================================== */

        setupGame();

        requestAnimationFrame(
            gameLoop
        );


        /* =================================================
           GLOBAL ERROR PROTECTION
        ================================================== */

        window.addEventListener(
            "error",
            event => {

                console.error(
                    "Ultimate World game error:",
                    event.error
                );

            }
        );

    </script>

</body>
</html>
