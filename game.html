<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#05060b">
<title>Ultimate World — Game</title>

<style>
:root{
    --bg:#05060b;
    --panel:#0b0d15;
    --panel2:#10131e;
    --line:rgba(255,255,255,.09);
    --text:#fff;
    --muted:#788196;
    --purple:#7657ff;
    --blue:#00d9ff;
    --pink:#ff4fcf;
    --green:#24e39a;
    --yellow:#ffd45a;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    background:var(--bg);
    color:#fff;
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

button{
    font:inherit;
    cursor:pointer;
}

button:focus-visible{
    outline:2px solid var(--blue);
}

/* =====================================================
   APP
===================================================== */

#app{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
}

/* =====================================================
   TOP BAR
===================================================== */

.game-top{
    height:68px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:13px;
    padding:10px 18px;
    border-bottom:1px solid var(--line);
    background:rgba(5,6,11,.88);
    backdrop-filter:blur(20px);
    z-index:50;
}

.back-btn,
.icon-btn{
    width:42px;
    height:42px;
    display:grid;
    place-items:center;
    color:#fff;
    border:1px solid var(--line);
    border-radius:12px;
    background:rgba(255,255,255,.045);
}

.back-btn:hover,
.icon-btn:hover{
    background:rgba(255,255,255,.09);
}

.game-title{
    min-width:0;
}

.game-title small{
    display:block;
    color:var(--blue);
    font-size:7px;
    font-weight:950;
    letter-spacing:.16em;
}

.game-title strong{
    display:block;
    margin-top:3px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    font-size:14px;
}

.top-spacer{
    flex:1;
}

.top-actions{
    display:flex;
    gap:7px;
}

/* =====================================================
   GAME AREA
===================================================== */

.game-stage{
    position:relative;
    flex:1;
    min-height:0;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:15px;
    background:
        radial-gradient(circle at 50% 40%,rgba(118,87,255,.08),transparent 38%),
        #05060b;
}

/* actual game container */

.game-screen{
    position:relative;
    width:min(1200px,100%);
    height:100%;
    max-height:760px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,.11);
    border-radius:22px;
    background:
        radial-gradient(circle at 50% 30%,rgba(0,217,255,.09),transparent 30%),
        linear-gradient(145deg,#0c0f19,#07080e);
    box-shadow:
        0 30px 90px rgba(0,0,0,.4),
        inset 0 0 80px rgba(118,87,255,.04);
}

/* =====================================================
   HUD
===================================================== */

.hud{
    position:absolute;
    left:16px;
    right:16px;
    top:15px;
    z-index:20;
    display:flex;
    justify-content:space-between;
    pointer-events:none;
}

.hud-left,
.hud-right{
    display:flex;
    gap:8px;
}

.hud-box{
    min-width:80px;
    padding:8px 11px;
    border:1px solid rgba(255,255,255,.1);
    border-radius:11px;
    background:rgba(5,6,11,.72);
    backdrop-filter:blur(12px);
}

.hud-box small{
    display:block;
    color:#6e788e;
    font-size:6px;
    font-weight:950;
    letter-spacing:.12em;
}

.hud-box strong{
    display:block;
    margin-top:3px;
    font-size:14px;
}

/* =====================================================
   GAME CANVAS
===================================================== */

#gameCanvas{
    width:100%;
    height:100%;
    display:block;
}

/* =====================================================
   START SCREEN
===================================================== */

.start-screen{
    position:absolute;
    inset:0;
    z-index:30;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:30px;
    background:
        radial-gradient(circle at 50% 45%,rgba(118,87,255,.18),transparent 30%),
        rgba(5,6,11,.72);
    backdrop-filter:blur(8px);
}

.start-card{
    width:min(540px,100%);
    padding:35px;
    text-align:center;
    border:1px solid rgba(255,255,255,.11);
    border-radius:24px;
    background:rgba(11,13,21,.88);
    box-shadow:0 30px 80px rgba(0,0,0,.35);
}

.game-logo{
    width:92px;
    height:92px;
    margin:0 auto 20px;
    display:grid;
    place-items:center;
    border-radius:27px;
    font-size:45px;
    background:
        linear-gradient(135deg,rgba(118,87,255,.35),rgba(0,217,255,.14));
    border:1px solid rgba(255,255,255,.12);
    box-shadow:0 20px 45px rgba(118,87,255,.18);
}

.start-card small{
    color:var(--blue);
    font-size:8px;
    font-weight:950;
    letter-spacing:.18em;
}

.start-card h1{
    margin:9px 0 10px;
    font-size:42px;
    line-height:.95;
    letter-spacing:-.06em;
}

.start-card p{
    margin:0 auto;
    max-width:420px;
    color:#7b8599;
    font-size:11px;
    line-height:1.65;
}

.start-buttons{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:9px;
    margin-top:24px;
}

.primary{
    min-height:45px;
    padding:0 20px;
    color:#fff;
    border:0;
    border-radius:12px;
    background:linear-gradient(135deg,var(--purple),#4b91ff);
    font-size:10px;
    font-weight:950;
    box-shadow:0 15px 35px rgba(118,87,255,.25);
}

.secondary{
    min-height:45px;
    padding:0 18px;
    color:#fff;
    border:1px solid var(--line);
    border-radius:12px;
    background:rgba(255,255,255,.045);
    font-size:10px;
    font-weight:900;
}

/* =====================================================
   PAUSE
===================================================== */

.pause-overlay,
.result-overlay{
    position:absolute;
    inset:0;
    z-index:40;
    display:none;
    align-items:center;
    justify-content:center;
    padding:25px;
    background:rgba(5,6,11,.72);
    backdrop-filter:blur(12px);
}

.pause-card,
.result-card{
    width:min(450px,100%);
    padding:30px;
    text-align:center;
    border:1px solid var(--line);
    border-radius:22px;
    background:rgba(11,13,21,.94);
}

.pause-card h2,
.result-card h2{
    margin:0 0 8px;
    font-size:30px;
}

.pause-card p,
.result-card p{
    color:#7c869a;
    font-size:10px;
    line-height:1.6;
}

.overlay-buttons{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:8px;
    margin-top:20px;
}

/* =====================================================
   MOBILE CONTROLS
===================================================== */

.mobile-controls{
    position:absolute;
    inset:0;
    z-index:15;
    pointer-events:none;
    display:none;
}

.control{
    position:absolute;
    width:62px;
    height:62px;
    display:grid;
    place-items:center;
    color:#fff;
    border:1px solid rgba(255,255,255,.15);
    border-radius:18px;
    background:rgba(255,255,255,.07);
    backdrop-filter:blur(10px);
    pointer-events:auto;
    user-select:none;
    touch-action:none;
    font-size:20px;
}

.control:active{
    transform:scale(.93);
    background:rgba(118,87,255,.3);
}

.left-control{
    left:20px;
    bottom:25px;
}

.right-control{
    left:95px;
    bottom:25px;
}

.action-control{
    right:25px;
    bottom:25px;
}

.action-control.two{
    right:100px;
}

/* =====================================================
   BOTTOM BAR
===================================================== */

.game-bottom{
    height:52px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    border-top:1px solid var(--line);
    background:rgba(5,6,11,.88);
}

.bottom-btn{
    min-height:32px;
    padding:0 12px;
    color:#788296;
    border:1px solid transparent;
    border-radius:9px;
    background:transparent;
    font-size:8px;
    font-weight:900;
}

.bottom-btn:hover{
    color:#fff;
    background:rgba(255,255,255,.05);
}

/* =====================================================
   TOAST
===================================================== */

.toast{
    position:fixed;
    left:50%;
    bottom:75px;
    z-index:100;
    transform:translate(-50%,20px);
    opacity:0;
    pointer-events:none;
    padding:11px 16px;
    border:1px solid var(--line);
    border-radius:11px;
    color:#fff;
    background:rgba(11,13,21,.94);
    box-shadow:0 15px 40px rgba(0,0,0,.35);
    font-size:9px;
    font-weight:850;
    transition:.25s ease;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

/* =====================================================
   SETTINGS
===================================================== */

.settings-panel{
    position:absolute;
    top:58px;
    right:10px;
    z-index:60;
    width:260px;
    display:none;
    padding:16px;
    border:1px solid var(--line);
    border-radius:15px;
    background:rgba(11,13,21,.97);
    box-shadow:0 20px 60px rgba(0,0,0,.4);
}

.settings-panel.open{
    display:block;
}

.settings-panel h3{
    margin:0 0 14px;
    font-size:13px;
}

.setting-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    padding:11px 0;
    border-top:1px solid rgba(255,255,255,.06);
}

.setting-row span{
    color:#7b8599;
    font-size:9px;
}

.toggle{
    width:38px;
    height:21px;
    padding:2px;
    border:0;
    border-radius:99px;
    background:#292d39;
}

.toggle span{
    display:block;
    width:17px;
    height:17px;
    border-radius:50%;
    background:#fff;
    transition:.2s;
}

.toggle.on{
    background:var(--purple);
}

.toggle.on span{
    transform:translateX(17px);
}

/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:700px){

    .game-top{
        height:59px;
        padding:8px 10px;
    }

    .game-title strong{
        font-size:12px;
    }

    .game-stage{
        padding:5px;
    }

    .game-screen{
        border-radius:14px;
    }

    .hud{
        left:8px;
        right:8px;
        top:8px;
    }

    .hud-box{
        min-width:65px;
        padding:7px 8px;
    }

    .hud-box strong{
        font-size:12px;
    }

    .mobile-controls{
        display:block;
    }

    .game-bottom{
        height:46px;
    }

    .bottom-btn{
        padding:0 8px;
        font-size:7px;
    }

    .start-card{
        padding:25px 18px;
    }

    .start-card h1{
        font-size:33px;
    }

    .game-logo{
        width:72px;
        height:72px;
        font-size:34px;
    }

}

/* =====================================================
   REDUCED MOTION
===================================================== */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{
        animation:none!important;
        transition:none!important;
    }

}
</style>
</head>

<body>

<div id="app">

    <!-- =================================================
         TOP BAR
    ================================================= -->

    <header class="game-top">

        <button
            class="back-btn"
            onclick="backToGameVerse()"
            aria-label="Back"
        >
            ←
        </button>

        <div class="game-title">

            <small>ULTIMATE WORLD • GAMEVERSE</small>

            <strong id="gameName">
                Neon Rush
            </strong>

        </div>

        <div class="top-spacer"></div>

        <div class="top-actions">

            <button
                class="icon-btn"
                onclick="toggleFullscreen()"
                title="Fullscreen"
            >
                ⛶
            </button>

            <button
                class="icon-btn"
                onclick="toggleSettings()"
                title="Settings"
            >
                ⚙
            </button>

        </div>

    </header>


    <!-- =================================================
         GAME STAGE
    ================================================= -->

    <main class="game-stage">

        <section class="game-screen" id="gameScreen">

            <!-- HUD -->

            <div class="hud">

                <div class="hud-left">

                    <div class="hud-box">

                        <small>SCORE</small>

                        <strong id="score">
                            0
                        </strong>

                    </div>

                    <div class="hud-box">

                        <small>BEST</small>

                        <strong id="best">
                            0
                        </strong>

                    </div>

                </div>


                <div class="hud-right">

                    <div class="hud-box">

                        <small>LEVEL</small>

                        <strong id="level">
                            1
                        </strong>

                    </div>

                    <div class="hud-box">

                        <small>TIME</small>

                        <strong id="time">
                            00:00
                        </strong>

                    </div>

                </div>

            </div>


            <!-- GAME CANVAS -->

            <canvas id="gameCanvas"></canvas>


            <!-- START -->

            <div
                class="start-screen"
                id="startScreen"
            >

                <div class="start-card">

                    <div
                        class="game-logo"
                        id="gameLogo"
                    >
                        🏎️
                    </div>

                    <small>
                        ULTIMATE WORLD ORIGINAL
                    </small>

                    <h1 id="startTitle">
                        Neon Rush
                    </h1>

                    <p id="startDescription">
                        Your universal game player is ready.
                        Start the experience and build your
                        score.
                    </p>

                    <div class="start-buttons">

                        <button
                            class="primary"
                            onclick="startGame()"
                        >
                            ▶ START GAME
                        </button>

                        <button
                            class="secondary"
                            onclick="backToGameVerse()"
                        >
                            ← GAMEVERSE
                        </button>

                    </div>

                </div>

            </div>


            <!-- PAUSE -->

            <div
                class="pause-overlay"
                id="pauseOverlay"
            >

                <div class="pause-card">

                    <h2>Paused</h2>

                    <p>
                        Your game is safely paused.
                    </p>

                    <div class="overlay-buttons">

                        <button
                            class="primary"
                            onclick="resumeGame()"
                        >
                            ▶ RESUME
                        </button>

                        <button
                            class="secondary"
                            onclick="restartGame()"
                        >
                            ↻ RESTART
                        </button>

                    </div>

                </div>

            </div>


            <!-- RESULTS -->

            <div
                class="result-overlay"
                id="resultOverlay"
            >

                <div class="result-card">

                    <div style="font-size:35px">
                        🏆
                    </div>

                    <h2>Run Complete</h2>

                    <p id="resultText">
                        Great run.
                    </p>

                    <div class="overlay-buttons">

                        <button
                            class="primary"
                            onclick="restartGame()"
                        >
                            ↻ PLAY AGAIN
                        </button>

                        <button
                            class="secondary"
                            onclick="backToGameVerse()"
                        >
                            GAMEVERSE
                        </button>

                    </div>

                </div>

            </div>


            <!-- MOBILE CONTROLS -->

            <div class="mobile-controls">

                <button
                    class="control left-control"
                    data-control="left"
                >
                    ◀
                </button>

                <button
                    class="control right-control"
                    data-control="right"
                >
                    ▶
                </button>

                <button
                    class="control action-control two"
                    data-control="action2"
                >
                    ✦
                </button>

                <button
                    class="control action-control"
                    data-control="action"
                >
                    ●
                </button>

            </div>


            <!-- SETTINGS -->

            <div
                class="settings-panel"
                id="settingsPanel"
            >

                <h3>Game Settings</h3>

                <div class="setting-row">

                    <span>Sound</span>

                    <button
                        class="toggle on"
                        id="soundToggle"
                        onclick="toggleSetting('soundToggle')"
                    >
                        <span></span>
                    </button>

                </div>

                <div class="setting-row">

                    <span>Music</span>

                    <button
                        class="toggle on"
                        id="musicToggle"
                        onclick="toggleSetting('musicToggle')"
                    >
                        <span></span>
                    </button>

                </div>

                <div class="setting-row">

                    <span>Vibration</span>

                    <button
                        class="toggle on"
                        id="vibrationToggle"
                        onclick="toggleSetting('vibrationToggle')"
                    >
                        <span></span>
                    </button>

                </div>

            </div>

        </section>

    </main>


    <!-- =================================================
         BOTTOM BAR
    ================================================= -->

    <footer class="game-bottom">

        <button
            class="bottom-btn"
            onclick="pauseGame()"
        >
            ⏸ PAUSE
        </button>

        <button
            class="bottom-btn"
            onclick="restartGame()"
        >
            ↻ RESTART
        </button>

        <button
            class="bottom-btn"
            onclick="toggleFullscreen()"
        >
            ⛶ FULLSCREEN
        </button>

        <button
            class="bottom-btn"
            onclick="backToGameVerse()"
        >
            🎮 GAMEVERSE
        </button>

    </footer>

</div>


<div
    class="toast"
    id="toast"
></div>


<script>

/* =========================================================
   ULTIMATE WORLD — UNIVERSAL GAME ENGINE
   ========================================================= */


/* ---------------------------------------------------------
   GAME CONFIGURATION
--------------------------------------------------------- */

const games = {

    "Neon Rush":{
        icon:"🏎️",
        category:"RACING",
        description:
            "A fast arcade experience built around speed, timing and survival."
    },

    "Goal Master":{
        icon:"⚽",
        category:"SPORTS",
        description:
            "Precision football challenges. More football modes will connect here."
    },

    "Mind Grid":{
        icon:"🧠",
        category:"PUZZLE",
        description:
            "Solve increasingly difficult logic challenges."
    },

    "Skybound":{
        icon:"🚀",
        category:"ADVENTURE",
        description:
            "Explore a mysterious world above the clouds."
    },

    "Pixel Arena":{
        icon:"⚡",
        category:"ARCADE",
        description:
            "Survive increasingly difficult waves."
    },

    "Orbit":{
        icon:"🪐",
        category:"STRATEGY",
        description:
            "Build and manage orbital systems."
    },

    "Tactical":{
        icon:"♟️",
        category:"STRATEGY",
        description:
            "Plan carefully. Every move matters."
    },

    "Creative Lab":{
        icon:"🎨",
        category:"CREATIVE",
        description:
            "Create, experiment and build."
    }

};


/* ---------------------------------------------------------
   GAME STATE
--------------------------------------------------------- */

let gameState = {

    running:false,

    paused:false,

    score:0,

    level:1,

    elapsed:0,

    lastTime:0,

    animationFrame:null,

    keys:{},

    player:{
        x:.5,
        y:.72,
        width:.08,
        height:.12,
        speed:.75
    },

    obstacles:[],

    particles:[]

};


/* ---------------------------------------------------------
   CANVAS
--------------------------------------------------------- */

const canvas =
    document.getElementById("gameCanvas");

const ctx =
    canvas.getContext("2d");

let width = 0;
let height = 0;


/* ---------------------------------------------------------
   RESIZE
--------------------------------------------------------- */

function resizeCanvas(){

    const rect =
        canvas.getBoundingClientRect();

    const ratio =
        Math.max(
            1,
            window.devicePixelRatio || 1
        );

    canvas.width =
        Math.floor(rect.width * ratio);

    canvas.height =
        Math.floor(rect.height * ratio);

    ctx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
    );

    width = rect.width;
    height = rect.height;

}

window.addEventListener(
    "resize",
    resizeCanvas
);

resizeCanvas();


/* ---------------------------------------------------------
   LOAD GAME FROM URL
--------------------------------------------------------- */

function loadGame(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    const requested =
        params.get("game");

    const game =
        games[requested] ||
        games["Neon Rush"];

    document.title =
        "Ultimate World — " +
        (requested || "Neon Rush");

    document.getElementById(
        "gameName"
    ).textContent =
        requested || "Neon Rush";

    document.getElementById(
        "startTitle"
    ).textContent =
        requested || "Neon Rush";

    document.getElementById(
        "gameLogo"
    ).textContent =
        game.icon;

    document.getElementById(
        "startDescription"
    ).textContent =
        game.description;

}

loadGame();


/* ---------------------------------------------------------
   START
--------------------------------------------------------- */

function startGame(){

    document.getElementById(
        "startScreen"
    ).style.display = "none";

    document.getElementById(
        "resultOverlay"
    ).style.display = "none";

    gameState.running = true;
    gameState.paused = false;
    gameState.score = 0;
    gameState.level = 1;
    gameState.elapsed = 0;
    gameState.obstacles = [];
    gameState.particles = [];
    gameState.player.x = .5;

    updateHUD();

    gameState.lastTime =
        performance.now();

    cancelAnimationFrame(
        gameState.animationFrame
    );

    gameLoop(
        gameState.lastTime
    );

    toast("Game started!");

}


/* ---------------------------------------------------------
   GAME LOOP
--------------------------------------------------------- */

function gameLoop(timestamp){

    if(!gameState.running){
        return;
    }

    if(gameState.paused){

        gameState.animationFrame =
            requestAnimationFrame(
                gameLoop
            );

        return;

    }

    const delta =
        Math.min(
            .035,
            (timestamp -
                gameState.lastTime) /
                1000
        );

    gameState.lastTime =
        timestamp;

    gameState.elapsed +=
        delta;

    updateGame(delta);

    drawGame();

    updateHUD();

    gameState.animationFrame =
        requestAnimationFrame(
            gameLoop
        );

}


/* ---------------------------------------------------------
   UPDATE
--------------------------------------------------------- */

function updateGame(delta){

    const keys =
        gameState.keys;

    let direction = 0;

    if(keys.ArrowLeft || keys.a){
        direction -= 1;
    }

    if(keys.ArrowRight || keys.d){
        direction += 1;
    }

    gameState.player.x +=
        direction *
        gameState.player.speed *
        delta;

    gameState.player.x =
        Math.max(
            .08,
            Math.min(
                .92,
                gameState.player.x
            )
        );

    /*
       Progressive difficulty.
    */

    gameState.level =
        1 +
        Math.floor(
            gameState.elapsed / 15
        );

    /*
       Score grows while surviving.
    */

    gameState.score =
        Math.floor(
            gameState.elapsed * 10 *
            gameState.level
        );

}


/* ---------------------------------------------------------
   DRAW
--------------------------------------------------------- */

function drawGame(){

    ctx.clearRect(
        0,
        0,
        width,
        height
    );

    /*
       Background.
    */

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            height
        );

    gradient.addColorStop(
        0,
        "#11152a"
    );

    gradient.addColorStop(
        1,
        "#05060b"
    );

    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    /*
       Decorative grid.
    */

    ctx.strokeStyle =
        "rgba(255,255,255,.045)";

    ctx.lineWidth = 1;

    const grid =
        55;

    for(
        let x = 0;
        x < width;
        x += grid
    ){

        ctx.beginPath();

        ctx.moveTo(x,0);
        ctx.lineTo(x,height);

        ctx.stroke();

    }

    for(
        let y = 0;
        y < height;
        y += grid
    ){

        ctx.beginPath();

        ctx.moveTo(0,y);
        ctx.lineTo(width,y);

        ctx.stroke();

    }


    /*
       Road / arena.
    */

    const roadWidth =
        width * .68;

    const roadX =
        (width - roadWidth) / 2;

    ctx.fillStyle =
        "rgba(255,255,255,.035)";

    ctx.fillRect(
        roadX,
        0,
        roadWidth,
        height
    );


    /*
       Road lines.
    */

    ctx.strokeStyle =
        "rgba(0,217,255,.17)";

    ctx.setLineDash([
        20,
        20
    ]);

    ctx.lineWidth = 3;

    ctx.beginPath();

    ctx.moveTo(
        width / 2,
        0
    );

    ctx.lineTo(
        width / 2,
        height
    );

    ctx.stroke();

    ctx.setLineDash([]);


    /*
       Player.
    */

    const px =
        gameState.player.x *
        width;

    const py =
        gameState.player.y *
        height;

    const pw =
        gameState.player.width *
        width;

    const ph =
        gameState.player.height *
        height;

    ctx.save();

    ctx.shadowBlur = 30;
    ctx.shadowColor =
        "rgba(118,87,255,.7)";

    const carGradient =
        ctx.createLinearGradient(
            px-pw,
            py,
            px+pw,
            py
        );

    carGradient.addColorStop(
        0,
        "#7657ff"
    );

    carGradient.addColorStop(
        1,
        "#00d9ff"
    );

    ctx.fillStyle =
        carGradient;

    roundRect(
        ctx,
        px-pw/2,
        py-ph/2,
        pw,
        ph,
        10
    );

    ctx.fill();

    ctx.restore();


    /*
       Player lights.
    */

    ctx.fillStyle =
        "#fff";

    ctx.beginPath();

    ctx.arc(
        px-pw*.22,
        py-ph*.28,
        3,
        0,
        Math.PI*2
    );

    ctx.arc(
        px+pw*.22,
        py-ph*.28,
        3,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       Center information.
    */

    ctx.textAlign = "center";

    ctx.fillStyle =
        "rgba(255,255,255,.22)";

    ctx.font =
        "900 10px Inter, sans-serif";

    ctx.fillText(
        "ULTIMATE WORLD",
        width/2,
        height*.12
    );

}


/* ---------------------------------------------------------
   ROUND RECT
--------------------------------------------------------- */

function roundRect(
    context,
    x,
    y,
    w,
    h,
    r
){

    context.beginPath();

    context.moveTo(
        x+r,
        y
    );

    context.arcTo(
        x+w,
        y,
        x+w,
        y+h,
        r
    );

    context.arcTo(
        x+w,
        y+h,
        x,
        y+h,
        r
    );

    context.arcTo(
        x,
        y+h,
        x,
        y,
        r
    );

    context.arcTo(
        x,
        y,
        x+w,
        y,
        r
    );

    context.closePath();

}


/* ---------------------------------------------------------
   HUD
--------------------------------------------------------- */

function updateHUD(){

    document.getElementById(
        "score"
    ).textContent =
        gameState.score;

    const currentBest =
        Number(
            localStorage.getItem(
                "uw_best_" +
                getCurrentGame()
            ) || 0
        );

    document.getElementById(
        "best"
    ).textContent =
        Math.max(
            currentBest,
            gameState.score
        );

    document.getElementById(
        "level"
    ).textContent =
        gameState.level;

    const seconds =
        Math.floor(
            gameState.elapsed
        );

    const minutes =
        Math.floor(
            seconds / 60
        );

    const remainder =
        seconds % 60;

    document.getElementById(
        "time"
    ).textContent =
        String(minutes).padStart(2,"0") +
        ":" +
        String(remainder).padStart(2,"0");

}


/* ---------------------------------------------------------
   CURRENT GAME
--------------------------------------------------------- */

function getCurrentGame(){

    return document.getElementById(
        "gameName"
    ).textContent;

}


/* ---------------------------------------------------------
   PAUSE
--------------------------------------------------------- */

function pauseGame(){

    if(!gameState.running){
        return;
    }

    gameState.paused = true;

    document.getElementById(
        "pauseOverlay"
    ).style.display = "flex";

}


/* ---------------------------------------------------------
   RESUME
--------------------------------------------------------- */

function resumeGame(){

    gameState.paused = false;

    gameState.lastTime =
        performance.now();

    document.getElementById(
        "pauseOverlay"
    ).style.display = "none";

}


/* ---------------------------------------------------------
   RESTART
--------------------------------------------------------- */

function restartGame(){

    document.getElementById(
        "pauseOverlay"
    ).style.display = "none";

    document.getElementById(
        "resultOverlay"
    ).style.display = "none";

    gameState.running = false;

    cancelAnimationFrame(
        gameState.animationFrame
    );

    document.getElementById(
        "startScreen"
    ).style.display = "flex";

}


/* ---------------------------------------------------------
   END GAME
--------------------------------------------------------- */

function endGame(){

    gameState.running = false;

    cancelAnimationFrame(
        gameState.animationFrame
    );

    const game =
        getCurrentGame();

    const key =
        "uw_best_" + game;

    const oldBest =
        Number(
            localStorage.getItem(
                key
            ) || 0
        );

    if(gameState.score > oldBest){

        localStorage.setItem(
            key,
            gameState.score
        );

    }

    document.getElementById(
        "resultText"
    ).textContent =
        "Score: " +
        gameState.score +
        " • Level: " +
        gameState.level;

    document.getElementById(
        "resultOverlay"
    ).style.display =
        "flex";

}


/* ---------------------------------------------------------
   KEYBOARD
--------------------------------------------------------- */

window.addEventListener(
    "keydown",
    event => {

        gameState.keys[
            event.key
        ] = true;

        if(
            event.key === "Escape" ||
            event.key === "p" ||
            event.key === "P"
        ){

            if(
                gameState.running &&
                !gameState.paused
            ){

                pauseGame();

            }else if(
                gameState.running &&
                gameState.paused
            ){

                resumeGame();

            }

        }

        if(event.key === " "){

            event.preventDefault();

        }

    }
);


window.addEventListener(
    "keyup",
    event => {

        gameState.keys[
            event.key
        ] = false;

    }
);


/* ---------------------------------------------------------
   MOBILE CONTROLS
--------------------------------------------------------- */

document
    .querySelectorAll(".control")
    .forEach(button => {

        const control =
            button.dataset.control;

        function press(event){

            event.preventDefault();

            if(control === "left"){
                gameState.keys.ArrowLeft = true;
            }

            if(control === "right"){
                gameState.keys.ArrowRight = true;
            }

            if(
                control === "action" ||
                control === "action2"
            ){

                gameState.keys[" "] = true;

            }

        }

        function release(event){

            event.preventDefault();

            if(control === "left"){
                gameState.keys.ArrowLeft = false;
            }

            if(control === "right"){
                gameState.keys.ArrowRight = false;
            }

            if(
                control === "action" ||
                control === "action2"
            ){

                gameState.keys[" "] = false;

            }

        }

        button.addEventListener(
            "pointerdown",
            press
        );

        button.addEventListener(
            "pointerup",
            release
        );

        button.addEventListener(
            "pointercancel",
            release
        );

        button.addEventListener(
            "pointerleave",
            release
        );

    });


/* ---------------------------------------------------------
   FULLSCREEN
--------------------------------------------------------- */

function toggleFullscreen(){

    const element =
        document.getElementById(
            "gameScreen"
        );

    if(!document.fullscreenElement){

        if(element.requestFullscreen){

            element.requestFullscreen();

        }

    }else{

        document.exitFullscreen();

    }

}


/* ---------------------------------------------------------
   SETTINGS
--------------------------------------------------------- */

function toggleSettings(){

    document
        .getElementById(
            "settingsPanel"
        )
        .classList.toggle("open");

}


function toggleSetting(id){

    const button =
        document.getElementById(id);

    button.classList.toggle("on");

}


/* ---------------------------------------------------------
   BACK
--------------------------------------------------------- */

function backToGameVerse(){

    window.location.href =
        "gameverse.html";

}


/* ---------------------------------------------------------
   TOAST
--------------------------------------------------------- */

let toastTimer;

function toast(message){

    const element =
        document.getElementById(
            "toast"
        );

    element.textContent =
        message;

    element.classList.add(
        "show"
    );

    clearTimeout(
        toastTimer
    );

    toastTimer =
        setTimeout(
            () => {

                element.classList.remove(
                    "show"
                );

            },
            2200
        );

}


/* ---------------------------------------------------------
   AUTO SAVE SESSION
--------------------------------------------------------- */

window.addEventListener(
    "beforeunload",
    () => {

        localStorage.setItem(
            "uw_last_game",
            getCurrentGame()
        );

    }
);


/* ---------------------------------------------------------
   INITIAL DRAW
--------------------------------------------------------- */

drawGame();

</script>
